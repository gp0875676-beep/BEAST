services:
  - type: web
    name: crypto-pump-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET
        sync: false
      - key: GATE_API_KEY
        sync: false
      - key: GATE_SECRET
        sync: false
      - key: OKX_API_KEY
        sync: false
      - key: OKX_SECRET
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
